[package]
name = "disklens-core"
description = "DiskLens scanner engine: parallel directory walk, MFT reader, compact tree, treemap layout."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
lz4_flex = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.58"

[dev-dependencies]
disklens-fixtures = { path = "../disklens-fixtures" }
