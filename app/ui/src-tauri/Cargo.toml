[package]
name = "havespace-app"
description = "HaveSpace desktop app (Tauri 2 shell around havespace-core)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "havespace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
havespace-core = { path = "../../../crates/havespace-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
window-vibrancy = "0.6"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
tauri-winrt-notification = "0.8.1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }
