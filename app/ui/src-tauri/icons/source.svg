    <rect x="488" y="408" width="90" height="118" rx="18" fill="#f59e0b" opacity="0.9"/>
    <rect x="588" y="408" width="90" height="118" rx="18" fill="#f43f5e" opacity="0.85"/>
    <rect x="226" y="538" width="160" height="140" rx="20" fill="#10b981" opacity="0.85"/>
    <rect x="398" y="538" width="280" height="140" rx="20" fill="#64748b" opacity="0.85"/>
