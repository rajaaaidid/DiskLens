  <circle cx="452" cy="452" r="232" fill="none" stroke="url(#lens)" stroke-width="44"/>
  <path d="M290 380 A175 175 0 0 1 400 286" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="22" stroke-linecap="round"/>
  <path d="M630 630 L792 792" stroke="url(#lens)" stroke-width="72" stroke-linecap="round"/>
