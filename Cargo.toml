[workspace]
resolver = "2"
members = ["crates/disklens-core", "crates/disklens-cli", "crates/disklens-fixtures", "app/ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
] }
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
